<div class="max-w-md mx-auto">
    <div class="bg-white rounded-3xl shadow-soft p-8">
        <h1 class="text-4xl font-black mb-2">Создать аккаунт</h1>
        <p class="text-gray-500 mb-6">Начните учить языки бесплатно</p>

        <input type="text" id="regName" placeholder="Имя" class="w-full border rounded-xl p-3 mb-3">
        <input type="text" id="regUsername" placeholder="Username" class="w-full border rounded-xl p-3 mb-3">
        <input type="email" id="regEmail" placeholder="Email" class="w-full border rounded-xl p-3 mb-3">
        <input type="password" id="regPassword" placeholder="Пароль" class="w-full border rounded-xl p-3 mb-3">
        <input type="password" id="regConfirm" placeholder="Подтвердите пароль" class="w-full border rounded-xl p-3 mb-4">

        <button id="doRegisterBtn" class="w-full bg-green-500 text-white py-3 rounded-xl font-bold hover:bg-green-600 transition">Зарегистрироваться</button>

        <div class="relative my-6">
            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
            <div class="relative flex justify-center text-xs"><span class="bg-white px-3 text-gray-400">или через</span></div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <button class="border rounded-xl py-2.5 flex items-center justify-center gap-2 hover:bg-gray-50 transition"><i class="fab fa-google text-red-500"></i> Google</button>
            <button class="border rounded-xl py-2.5 flex items-center justify-center gap-2 hover:bg-gray-50 transition"><i class="fas fa-phone-alt text-green-600"></i> Телефон</button>
        </div>

        <p class="text-center text-gray-500 mt-6">
            Уже есть аккаунт?
            <a href="#" id="toLoginFromReg" class="text-green-600 font-semibold hover:underline">Войти</a>
        </p>
    </div>
</div>
