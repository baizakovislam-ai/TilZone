<div class="max-w-md mx-auto">
    <div class="bg-white rounded-3xl shadow-soft p-8">
        <h1 class="text-4xl font-black mb-2">Добро пожаловать</h1>
        <p class="text-gray-500 mb-6">Войдите, чтобы продолжить обучение</p>

        <input type="text" id="loginEmail" placeholder="Email или username" class="w-full border rounded-xl p-3 mb-3">
        <input type="password" id="loginPassword" placeholder="Пароль" class="w-full border rounded-xl p-3 mb-4">
        <button id="doLoginBtn" class="w-full bg-green-500 text-white py-3 rounded-xl font-bold hover:bg-green-600 transition">Войти</button>

        <div class="text-right mt-2">
            <a href="#" id="forgotLink" class="text-sm text-green-600 hover:underline">Забыли пароль?</a>
        </div>

        <div class="relative my-6">
            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
            <div class="relative flex justify-center text-xs"><span class="bg-white px-3 text-gray-400">или продолжите через</span></div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <button class="border rounded-xl py-2.5 flex items-center justify-center gap-2 hover:bg-gray-50 transition"><i class="fab fa-google text-red-500"></i> Google</button>
            <button class="border rounded-xl py-2.5 flex items-center justify-center gap-2 hover:bg-gray-50 transition"><i class="fas fa-phone-alt text-green-600"></i> Телефон</button>
        </div>

        <p class="text-center text-gray-500 mt-6">
            Нет аккаунта?
            <a href="#" id="toRegisterFromLogin" class="text-green-600 font-semibold hover:underline">Зарегистрироваться</a>
        </p>
    </div>
</div>
