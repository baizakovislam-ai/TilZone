<!-- pages/lesson.html — ID соответствуют script.js -->
<div class="max-w-2xl mx-auto space-y-5">

  <!-- Заголовок -->
  <div class="flex items-center gap-3">
    <button id="backToHomeBtn"
            class="w-10 h-10 rounded-full bg-white shadow-soft flex items-center justify-center
                   hover:bg-gray-50 active:scale-95 transition flex-shrink-0">
      <i class="fas fa-arrow-left text-gray-500"></i>
    </button>
    <div class="flex-1 min-w-0">
      <p class="text-xs font-bold text-green-600 uppercase tracking-widest" id="lessonLevel">A1</p>
      <h1 class="text-xl font-black truncate leading-tight" id="lessonTitle">Жүктөлүүдө...</h1>
    </div>
    <div class="text-right flex-shrink-0">
      <p class="text-xs text-gray-400">Сыйлык</p>
      <p class="font-black text-green-600 text-lg" id="lessonXpReward">+20 XP</p>
    </div>
  </div>

  <!-- Прогресс -->
  <div id="progressSection" class="hidden bg-white rounded-2xl p-4 shadow-soft">
    <div class="flex justify-between text-sm font-semibold text-gray-500 mb-2">
      <span id="taskProgressLabel">1-задание / 0</span>
      <span id="taskScoreLabel" class="text-green-600 font-black">0 XP</span>
    </div>
    <div class="h-3 bg-gray-100 rounded-full overflow-hidden">
      <div id="taskProgressBar"
           class="h-full bg-gradient-to-r from-green-400 to-emerald-500 rounded-full transition-all duration-700"
           style="width:0%"></div>
    </div>
    <!-- Шаги-точки -->
    <div id="taskSteps" class="flex gap-1.5 mt-3 flex-wrap"></div>
  </div>

  <!-- Теория к уроку (коллапс) -->
  <div id="theoryPanel" class="hidden">
    <div class="bg-blue-50 border border-blue-100 rounded-2xl overflow-hidden">
      <!-- Заголовок секции теории -->
      <div class="flex items-center gap-3 p-5 border-b border-blue-100">
        <i class="fas fa-graduation-cap text-blue-600 text-xl"></i>
        <div>
          <p class="font-bold text-blue-800">Сабакка теория</p>
          <p class="text-xs text-blue-500">Алгач теорияны окуңуз, андан соң тапшырмаларды аткарыңыз</p>
        </div>
      </div>
      <!-- Контент теории -->
      <div id="theoryContent" class="p-5 space-y-4"></div>
      <!-- Кнопка перейти к заданиям -->
      <div class="p-4 border-t border-blue-100">
        <button id="startTasksBtn"
                class="w-full bg-green-500 text-white py-3 rounded-xl font-bold
                       hover:bg-green-600 active:scale-[0.98] transition text-sm">
          Тапшырмаларга өтүү <i class="fas fa-arrow-right ml-1"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Карточка задания -->
  <div id="taskCard" class="hidden bg-white rounded-3xl p-6 md:p-8 shadow-soft min-h-[280px] flex flex-col">
    <div class="flex-1 flex items-center justify-center">
      <div class="text-center">
        <i class="fas fa-spinner fa-spin text-4xl text-green-400 mb-3"></i>
        <p class="text-gray-400 text-sm">Тапшырмалар жүктөлүүдө...</p>
      </div>
    </div>
  </div>

  <!-- Навигация -->
  <div id="navButtons" class="hidden flex gap-3 justify-between items-center">
    <button id="prevTaskBtn"
            class="invisible px-5 py-2.5 rounded-xl border border-gray-200 text-gray-600
                   hover:bg-gray-50 transition text-sm font-medium">
      <i class="fas fa-chevron-left mr-1"></i> Артка
    </button>
    <div class="flex gap-3">
      <button id="nextTaskBtn"
              class="hidden px-6 py-2.5 rounded-xl bg-green-500 text-white font-semibold
                     hover:bg-green-600 active:scale-[0.98] transition text-sm shadow-sm">
        Кийинки <i class="fas fa-chevron-right ml-1"></i>
      </button>
      <button id="completeBtn"
              class="hidden px-6 py-2.5 rounded-xl font-semibold text-sm text-white shadow-md
                     bg-gradient-to-r from-amber-400 to-orange-400 hover:opacity-90
                     active:scale-[0.98] transition">
        🏁 Сабакты аяктоо
      </button>
    </div>
  </div>

</div>
